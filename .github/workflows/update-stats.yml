
name: Update GitHub Profile Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=akshitam18&show_icons=true&theme=dark&hide_border=true'
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=akshitam18&layout=compact&langs_count=8&theme=dark&hide_border=true'
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate HTE AI Assistant Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: 'username=akshitam18&repo=hte-ai-assistant&theme=dark&hide_border=true'
          path: profile/hte-ai-assistant.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate JalRakshak Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: 'username=jiyac-code&repo=JalRakshak&theme=dark&hide_border=true'
          path: profile/jalrakshak.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate PackSenseAI Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: 'username=omisha123&repo=PackSenseAI&theme=dark&hide_border=true'
          path: profile/packsenseai.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate VJTI Finds Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: 'username=bhumikaborkar7&repo=VJTI-Finds&theme=dark&hide_border=true'
          path: profile/vjti-finds.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
 
      - name: Generate Contribution Streak
        uses: zients/github-readme-streak-stats@v2
        with:
          options: 'user=akshitam18&theme=dark&hide_border=true&disable_animations=true'
          path: profile/streak.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update GitHub profile cards"
            git push
          fi
